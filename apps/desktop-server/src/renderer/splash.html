<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BizFlow - Starting...</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
      }

      .splash-container {
        background: linear-gradient(
          135deg,
          oklch(0.488 0.243 264.376),
          oklch(0.623 0.214 259.815)
        );
        border-radius: 16px;
        padding: 48px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        width: 500px;
      }

      .logo {
        font-size: 48px;
        font-weight: 700;
        color: oklch(0.97 0.014 254.604);
        margin-bottom: 24px;
        letter-spacing: -1px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }

      .logo-icon {
        width: 48px;
        height: 48px;
      }

      .status {
        color: oklch(0.97 0.014 254.604);
        font-size: 16px;
        margin-bottom: 32px;
        min-height: 24px;
        opacity: 0.9;
      }

      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid oklch(0.97 0.014 254.604 / 20%);
        border-top-color: oklch(0.97 0.014 254.604);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .progress-steps {
        margin-top: 32px;
        text-align: left;
        color: oklch(0.97 0.014 254.604);
        font-size: 14px;
      }

      .progress-step {
        padding: 8px 0;
        opacity: 0.5;
        transition: opacity 0.3s;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .progress-step.active {
        opacity: 1;
        font-weight: 600;
      }

      .step-icon {
        width: 16px;
        height: 16px;
      }

      .icon-state-active,
      .icon-state-done {
        display: none;
      }

      .icon-state-pending {
        display: block;
      }

      .progress-step.active .icon-state-pending {
        display: none;
      }
      .progress-step.active .icon-state-active {
        display: block;
      }

      .progress-step.done .icon-state-pending {
        display: none;
      }
      .progress-step.done .icon-state-done {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="splash-container">
      <div class="logo">
        <svg
          class="logo-icon"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M15 21v-5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v5" />
          <path
            d="M17.774 10.31a1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.451 0 1.12 1.12 0 0 0-1.548 0 2.5 2.5 0 0 1-3.452 0 1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.77-3.248l2.889-4.184A2 2 0 0 1 7 2h10a2 2 0 0 1 1.653.873l2.895 4.192a2.5 2.5 0 0 1-3.774 3.244"
          />
          <path d="M4 10.95V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8.05" />
        </svg>
        BizFlow
      </div>
      <div class="status" id="status">Starting server...</div>
      <div class="spinner"></div>
      <div class="progress-steps">
        <div class="progress-step" id="step-1">
          <svg
            class="step-icon icon-state-pending"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10" />
          </svg>
          <svg
            class="step-icon icon-state-active"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10" />
          </svg>
          <svg
            class="step-icon icon-state-done"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 6 9 17l-5-5" />
          </svg>
          Checking ports...
        </div>
        <div class="progress-step" id="step-2">
          <svg
            class="step-icon icon-state-pending"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10" />
          </svg>
          <svg
            class="step-icon icon-state-active"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10" />
          </svg>
          <svg
            class="step-icon icon-state-done"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 6 9 17l-5-5" />
          </svg>
          Starting API server...
        </div>
        <div class="progress-step" id="step-3">
          <svg
            class="step-icon icon-state-pending"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10" />
          </svg>
          <svg
            class="step-icon icon-state-active"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10" />
          </svg>
          <svg
            class="step-icon icon-state-done"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 6 9 17l-5-5" />
          </svg>
          Starting Web server...
        </div>
        <div class="progress-step" id="step-4">
          <svg
            class="step-icon icon-state-pending"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10" />
          </svg>
          <svg
            class="step-icon icon-state-active"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10" />
          </svg>
          <svg
            class="step-icon icon-state-done"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 6 9 17l-5-5" />
          </svg>
          Ready!
        </div>
      </div>
    </div>

    <script>
      let currentStep = 0;
      const steps = ['step-1', 'step-2', 'step-3', 'step-4'];

      window.electronAPI?.on.statusUpdate((message) => {
        document.getElementById('status').textContent = message;

        // Update progress steps based on message
        if (message.includes('port')) {
          setActiveStep(0);
        } else if (message.includes('API')) {
          setActiveStep(1);
        } else if (message.includes('Web')) {
          setActiveStep(2);
        } else if (message.includes('running') || message.includes('Ready')) {
          setActiveStep(3);
        }
      });

      function setActiveStep(index) {
        // Mark previous steps as done
        for (let i = 0; i < index; i++) {
          const el = document.getElementById(steps[i]);
          el.classList.remove('active');
          el.classList.add('done');
        }

        // Mark current step as active
        if (index < steps.length) {
          const el = document.getElementById(steps[index]);
          el.classList.add('active');
        }

        currentStep = index;
      }
    </script>
  </body>
</html>
