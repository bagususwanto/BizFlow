<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BizFlow Server - License Activation</title>
    <link rel="stylesheet" href="license.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1 data-i18n="license.title">
          <div
            class="icon-lg"
            style="mask-image: url('assets/icons/key.png')"
          ></div>
          License Activation
        </h1>
        <p class="subtitle" data-i18n="license.subtitle">
          Activate your BizFlow Server license
        </p>
      </div>

      <div id="activation-form" class="card">
        <div class="form-group">
          <label for="license-key" data-i18n="label.licenseKey"
            >License Key</label
          >
          <input
            type="text"
            id="license-key"
            placeholder="BZFL-XXXX-XXXX-XXXX-SIGNATURE..."
            style="font-family: monospace"
          />
          <small data-i18n="label.format"
            >Format: BZFL-[MachineID]-[Signature]</small
          >
        </div>

        <div class="form-group">
          <label data-i18n="label.deviceId">Device ID</label>
          <div class="input-group">
            <div class="device-id" id="device-id">Loading...</div>
            <button id="copy-btn" class="btn-secondary" title="Copy Device ID">
              <div
                class="icon-sm"
                style="mask-image: url('assets/icons/copy.png')"
              ></div>
            </button>
          </div>
          <small data-i18n="label.shareId"
            >Share this ID with the administrator to get your license key</small
          >
        </div>

        <button id="activate-btn" class="btn-primary" data-i18n="btn.activate">
          Activate License
        </button>

        <div id="message" class="message"></div>
      </div>

      <div id="license-info" class="card" style="display: none">
        <h2>
          <div
            class="icon"
            style="mask-image: url('assets/icons/check-circle.png')"
          ></div>
          <span data-i18n="status.active">License Active</span>
        </h2>

        <div class="info-row">
          <span class="label" data-i18n="label.licenseKey">License Key:</span>
          <span id="info-key" class="value"></span>
        </div>

        <div class="info-row">
          <span class="label" data-i18n="label.activated">Activated:</span>
          <span id="info-activated" class="value"></span>
        </div>

        <div class="info-row">
          <span class="label" data-i18n="label.expires">Expires:</span>
          <span id="info-expires" class="value"></span>
        </div>

        <div class="info-row">
          <span class="label" data-i18n="label.status">Status:</span>
          <span id="info-status" class="value"></span>
        </div>

        <button
          id="deactivate-btn"
          class="btn-danger"
          data-i18n="btn.deactivate"
        >
          Deactivate License
        </button>
      </div>
    </div>

    <script src="i18n.js"></script>
    <script src="license.js"></script>
  </body>
</html>
