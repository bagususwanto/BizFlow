<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BizFlow - Starting...</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
      }

      .splash-container {
        background: linear-gradient(
          135deg,
          oklch(0.488 0.243 264.376),
          oklch(0.623 0.214 259.815)
        );
        border-radius: 16px;
        padding: 48px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        width: 500px;
      }

      .logo {
        font-size: 48px;
        font-weight: 700;
        color: oklch(0.97 0.014 254.604);
        margin-bottom: 24px;
        letter-spacing: -1px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }

      .logo-icon {
        width: 48px;
        height: 48px;
        filter: brightness(0) invert(1);
      }

      .status {
        color: oklch(0.97 0.014 254.604);
        font-size: 16px;
        margin-bottom: 32px;
        min-height: 24px;
        opacity: 0.9;
      }

      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid oklch(0.97 0.014 254.604 / 20%);
        border-top-color: oklch(0.97 0.014 254.604);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .progress-steps {
        margin-top: 32px;
        text-align: left;
        color: oklch(0.97 0.014 254.604);
        font-size: 14px;
      }

      .progress-step {
        padding: 8px 0;
        opacity: 0.5;
        transition: opacity 0.3s;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .progress-step.active {
        opacity: 1;
        font-weight: 600;
      }

      .step-icon {
        width: 16px;
        height: 16px;
        display: inline-block;
        background-color: currentColor; /* Inherits text color */
        -webkit-mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-size: contain;
        mask-repeat: no-repeat;
        mask-position: center;
      }

      .icon-state-active,
      .icon-state-done {
        display: none;
      }

      .icon-state-pending {
        display: block;
      }

      .progress-step.active .icon-state-pending {
        display: none;
      }
      .progress-step.active .icon-state-active {
        display: block;
      }

      .progress-step.done .icon-state-pending {
        display: none;
      }
      .progress-step.done .icon-state-done {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="splash-container">
      <div class="logo">
        <div
          class="logo-icon"
          style="mask-image: url('assets/icons/store.png')"
        ></div>
        BizFlow
      </div>
      <div class="status" id="status">Starting server...</div>
      <div class="spinner"></div>
      <div class="progress-steps">
        <div class="progress-step" id="step-1">
          <div
            class="step-icon icon-state-pending"
            style="mask-image: url('assets/icons/circle.png')"
          ></div>
          <div
            class="step-icon icon-state-active"
            style="mask-image: url('assets/icons/circle.png')"
          ></div>
          <div
            class="step-icon icon-state-done"
            style="mask-image: url('assets/icons/check.png')"
          ></div>
          Checking ports...
        </div>
        <div class="progress-step" id="step-2">
          <div
            class="step-icon icon-state-pending"
            style="mask-image: url('assets/icons/circle.png')"
          ></div>
          <div
            class="step-icon icon-state-active"
            style="mask-image: url('assets/icons/circle.png')"
          ></div>
          <div
            class="step-icon icon-state-done"
            style="mask-image: url('assets/icons/check.png')"
          ></div>
          Starting API server...
        </div>
        <div class="progress-step" id="step-3">
          <div
            class="step-icon icon-state-pending"
            style="mask-image: url('assets/icons/circle.png')"
          ></div>
          <div
            class="step-icon icon-state-active"
            style="mask-image: url('assets/icons/circle.png')"
          ></div>
          <div
            class="step-icon icon-state-done"
            style="mask-image: url('assets/icons/check.png')"
          ></div>
          Starting Web server...
        </div>
        <div class="progress-step" id="step-4">
          <div
            class="step-icon icon-state-pending"
            style="mask-image: url('assets/icons/circle.png')"
          ></div>
          <div
            class="step-icon icon-state-active"
            style="mask-image: url('assets/icons/circle.png')"
          ></div>
          <div
            class="step-icon icon-state-done"
            style="mask-image: url('assets/icons/check.png')"
          ></div>
          Ready!
        </div>
      </div>
    </div>

    <script>
      let currentStep = 0;
      const steps = ['step-1', 'step-2', 'step-3', 'step-4'];

      window.electronAPI?.on.statusUpdate((message) => {
        document.getElementById('status').textContent = message;

        // Update progress steps based on message
        if (message.includes('port')) {
          setActiveStep(0);
        } else if (message.includes('API')) {
          setActiveStep(1);
        } else if (message.includes('Web')) {
          setActiveStep(2);
        } else if (message.includes('running') || message.includes('Ready')) {
          setActiveStep(3);
        }
      });

      function setActiveStep(index) {
        // Mark previous steps as done
        for (let i = 0; i < index; i++) {
          const el = document.getElementById(steps[i]);
          el.classList.remove('active');
          el.classList.add('done');
        }

        // Mark current step as active
        if (index < steps.length) {
          const el = document.getElementById(steps[index]);
          el.classList.add('active');
        }

        currentStep = index;
      }
    </script>
  </body>
</html>
